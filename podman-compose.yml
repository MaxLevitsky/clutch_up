version: "3.9"

services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////app/data/clutchup.db
      SECRET_KEY: change-me-in-production
    volumes:
      - db-data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "9999:80"
    depends_on:
      - backend

volumes:
  db-data:
